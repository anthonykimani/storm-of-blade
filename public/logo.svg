<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#3a2f1a"/>
      <stop offset="45%" stop-color="#1a1d22"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
    <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c75e" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f0c75e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f0c75e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#cfd8e3"/>
      <stop offset="52%" stop-color="#8f9aa8"/>
      <stop offset="74%" stop-color="#dbe4ee"/>
      <stop offset="100%" stop-color="#6f7a88"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="35%" stop-color="#f0c75e"/>
      <stop offset="70%" stop-color="#c9962f"/>
      <stop offset="100%" stop-color="#8a5f1b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f8b99"/>
      <stop offset="45%" stop-color="#f2f6fb"/>
      <stop offset="55%" stop-color="#cfd8e3"/>
      <stop offset="100%" stop-color="#6d7885"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#2e1c10"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1400" height="700" fill="url(#bgGlow)"/>
  <rect width="1400" height="700" fill="#0b0d10" opacity="0.15"/>
  <ellipse cx="700" cy="210" rx="330" ry="240" fill="url(#arenaGlow)"/>

  <!-- embers -->
  <g fill="#f0c75e" opacity="0.7">
    <circle cx="310" cy="120" r="2.2"/><circle cx="1040" cy="90" r="1.8"/>
    <circle cx="1180" cy="230" r="2.4"/><circle cx="210" cy="300" r="1.7"/>
    <circle cx="980" cy="330" r="2"/><circle cx="430" cy="80" r="1.6"/>
    <circle cx="1230" cy="400" r="1.8"/><circle cx="160" cy="180" r="1.5"/>
  </g>

  <!-- crossed swords -->
  <g filter="url(#shadow)">
    <g transform="translate(700 190) rotate(38)">
      <polygon points="-13,-168 13,-160 13,74 -13,74" fill="url(#blade)"/>
      <polygon points="0,-168 13,-160 13,110 0,110" fill="#ffffff" opacity="0.35"/>
      <rect x="-62" y="68" width="124" height="18" rx="8" fill="url(#gold)"/>
      <circle cx="-62" cy="77" r="9" fill="url(#gold)"/>
      <circle cx="62" cy="77" r="9" fill="url(#gold)"/>
      <rect x="-13" y="84" width="26" height="62" rx="10" fill="url(#grip)"/>
      
    </g>
    <g transform="translate(700 190) rotate(-38)">
      <polygon points="-13,-168 13,-160 13,74 -13,74" fill="url(#blade)"/>
      <polygon points="0,-168 13,-160 13,110 0,110" fill="#ffffff" opacity="0.35"/>
      <rect x="-62" y="68" width="124" height="18" rx="8" fill="url(#gold)"/>
      <circle cx="-62" cy="77" r="9" fill="url(#gold)"/>
      <circle cx="62" cy="77" r="9" fill="url(#gold)"/>
      <rect x="-13" y="84" width="26" height="62" rx="10" fill="url(#grip)"/>
      
    </g>
  </g>

  <!-- clash sparks -->
  <g filter="url(#softGlow)" stroke="#ffe9a8" stroke-linecap="round">
    <line x1="700" y1="190" x2="700" y2="138" stroke-width="7"/>
    <line x1="700" y1="190" x2="662" y2="154" stroke-width="5"/>
    <line x1="700" y1="190" x2="738" y2="154" stroke-width="5"/>
    <line x1="700" y1="190" x2="640" y2="198" stroke-width="5"/>
    <line x1="700" y1="190" x2="760" y2="198" stroke-width="5"/>
    <line x1="700" y1="190" x2="700" y2="242" stroke-width="4"/>
  </g>
  <circle cx="700" cy="190" r="13" fill="#fff7d6" filter="url(#softGlow)"/>

  <!-- emblem ring -->
  <circle cx="700" cy="190" r="128" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.85"/>
  <circle cx="700" cy="190" r="140" fill="none" stroke="#f0c75e" stroke-width="1.4" opacity="0.45"/>
  <circle cx="700" cy="190" r="118" fill="none" stroke="#cfd8e3" stroke-width="1.2" opacity="0.28"/>

  <!-- title -->
  <g filter="url(#textShadow)">
    <text x="700" y="410" text-anchor="middle" font-family="Arial Black, Impact, 'Segoe UI Black', sans-serif"
      font-size="56" letter-spacing="18" fill="#cfd8e3" opacity="0.95">CLASH OF</text>
    <text x="700" y="545" text-anchor="middle" font-family="Arial Black, Impact, 'Segoe UI Black', sans-serif"
      font-size="152" font-weight="900" letter-spacing="6"
      fill="url(#steel)" stroke="#0b0d10" stroke-width="10" paint-order="stroke fill">STEEL</text>
    <text x="700" y="545" text-anchor="middle" font-family="Arial Black, Impact, 'Segoe UI Black', sans-serif"
      font-size="152" font-weight="900" letter-spacing="6"
      fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85">STEEL</text>
  </g>

  <!-- divider + subtitle -->
  <g>
    <line x1="420" y1="590" x2="640" y2="590" stroke="url(#gold)" stroke-width="2"/>
    <line x1="760" y1="590" x2="980" y2="590" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="700,580 710,590 700,600 690,590" fill="url(#gold)"/>
    <text x="700" y="636" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="30" font-weight="600" letter-spacing="16" fill="url(#gold)">ARENA DUEL</text>
  </g>
</svg>
